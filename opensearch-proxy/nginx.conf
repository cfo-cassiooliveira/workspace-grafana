# Proxy SOMENTE LEITURA na frente do OpenSearch do Graylog (ADR-0004). Roda como usuário não-root (101), rootfs
# read-only (só /tmp em tmpfs) e sem porta no host. Toda a decisão (método, caminho, índices) fica em guard.js (njs);
# aqui só há o transporte e os limites. Mudança de allowlist: edite guard.js e rode ./scripts/smoke-proxy.sh.
load_module modules/ngx_http_js_module.so;

worker_processes 1;
pid /tmp/nginx.pid;
error_log /dev/stderr warn;

events { worker_connections 256; }

http {
  js_import guard from /etc/nginx/guard.js;
  include /etc/nginx/mime.types;
  default_type application/json;

  # Caminhos temporários em tmpfs (o rootfs é read-only).
  client_body_temp_path /tmp/client_body;
  proxy_temp_path /tmp/proxy;
  fastcgi_temp_path /tmp/fastcgi;
  uwsgi_temp_path /tmp/uwsgi;
  scgi_temp_path /tmp/scgi;

  # Log de acesso só com método, caminho sem query e status (sem corpo, sem dados).
  log_format ro '$request_method $uri $status $body_bytes_sent';
  access_log /dev/stdout ro;

  server_tokens off;
  # DNS do Docker; com o upstream em variável, o nome é resolvido em uso e o proxy sobe mesmo sem o OpenSearch.
  resolver 127.0.0.11 valid=10s ipv6=off;

  # Limites: o corpo inteiro é lido em memória para ser validado antes de chegar ao OpenSearch.
  client_max_body_size 1m;
  client_body_buffer_size 1m;
  client_header_timeout 10s;
  client_body_timeout 10s;
  send_timeout 30s;
  keepalive_timeout 30s;
  # Teto da resposta repassada pelo guard: consulta que devolva mais que isso falha.
  subrequest_output_buffer_size 16m;

  server {
    listen 8080;

    # Healthcheck do próprio proxy (não toca o OpenSearch).
    location = /_proxy_health { default_type text/plain; return 200 "ok\n"; }

    # Tudo passa pelo guard; só ele chama o upstream (location interna abaixo).
    location / { js_content guard.route; }

    location ~ ^/_up(?<upstream_path>/.*)$ {
      internal;
      set $upstream opensearch:9200;
      rewrite ^ $upstream_path break;
      proxy_pass http://$upstream;
      proxy_http_version 1.1;
      proxy_connect_timeout 3s;
      proxy_read_timeout 30s;
      proxy_send_timeout 30s;
      proxy_set_header Connection "";
      # Sem compressão: o guard repassa o corpo cru e não reenvia Content-Encoding.
      proxy_set_header Accept-Encoding "";
      proxy_set_header Content-Type $http_content_type;
    }
  }
}
