        annotations:
          summary: "A fila {{ $labels.queue }} (vhost {{ $labels.vhost }}) tem mensagens que não voltam pelo TTL."
          description: "O normal é sair em 30 s. Confira no broker se a policy de retry (message-ttl e dead-letter-exchange) está aplicada à fila."
