              expr: 'rabbitmq_queue_messages_ready{job="rabbitmq",queue=~".*\\.retry"} > on(vhost, queue) (sum by (vhost, queue) (increase(rabbitmq_queue_exchange_messages_published_total{job="rabbitmq",queue=~".*\\.retry"}[5m])) or on(vhost, queue) (0 * rabbitmq_queue_messages_ready{job="rabbitmq",queue=~".*\\.retry"}))'
