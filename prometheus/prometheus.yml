# Prometheus do Workspace (ADR-0003): só health check das APIs por blackbox. Keycloak/SonarQube ficam para a T21.
global:
  scrape_interval: 15s
  scrape_timeout: 10s
  evaluation_interval: 30s

rule_files:
  - /etc/prometheus/rules.yml

scrape_configs:
  # Saúde dos próprios componentes (alvo `up`).
  - job_name: prometheus
    static_configs:
      - targets: ["localhost:9090"]

  - job_name: blackbox
    static_configs:
      - targets: ["blackbox:9115"]

  # Health check das APIs: os alvos ficam em targets/*.yml (file_sd, versionados); cada um vira uma sonda no blackbox.
  - job_name: api-health
    metrics_path: /probe
    params:
      module: [http_2xx]
    file_sd_configs:
      - files: ["/etc/prometheus/targets/*.yml"]
        refresh_interval: 15s
    relabel_configs:
      - source_labels: [__address__]
        target_label: __param_target
      - source_labels: [__param_target]
        target_label: instance
      - target_label: __address__
        replacement: blackbox:9115
