# Grafana OSS (dashboards e alertas do Workspace sobre o Graylog/OpenSearch). Só o serviço grafana (ADR-0001).
# Uso: ./scripts/generate-env.sh && docker compose up -d --build     (UI: http://localhost:3000)
# Pré-requisito: redes externas observability, workspace-identity e logs-read (criadas por graylog/keycloak) e
# metrics (criada por prometheus/docker-compose.metrics.yml; suba-o antes: docker compose -f prometheus/docker-compose.metrics.yml up -d).
# Toda a configuração entra por GF_* e arquivos em provisioning/ (allowUiUpdates: false); nada só pela UI.
name: grafana

services:
  grafana:
    build: .
    image: workspace/grafana:13.3.1
    # Teto de memória: um serviço não derruba os demais na VM do WSL2 (20 GB, ver ~/.wslconfig).
    mem_limit: 512m
    environment:
      GF_SERVER_ROOT_URL: http://localhost:3000
      GF_SERVER_HTTP_ADDR: 0.0.0.0
      # Conta de recuperação (break-glass); o acesso normal será pelo Keycloak (ADR-0002).
      GF_SECURITY_ADMIN_USER: ${GRAFANA_ADMIN_USER:?defina GRAFANA_ADMIN_USER no .env}
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_ADMIN_PASSWORD:?defina GRAFANA_ADMIN_PASSWORD no .env}
      GF_SECURITY_SECRET_KEY: ${GF_SECURITY_SECRET_KEY:?defina GF_SECURITY_SECRET_KEY no .env}
      GF_SECURITY_DISABLE_GRAVATAR: "true"
      GF_SECURITY_COOKIE_SAMESITE: lax
      # false só porque o acesso local é HTTP; em HTTPS (produção) deve ser true.
      GF_SECURITY_COOKIE_SECURE: "false"
      GF_SECURITY_CONTENT_SECURITY_POLICY: "true"
      # Mais restritivo que o padrão do Grafana: sem 'unsafe-eval', sem grafana.com/cartocdn em connect-src, imagens só
      # do próprio Grafana (img-src sem "*") e sem embutir em frames. "$$" é o escape do compose para "$" literal.
      GF_SECURITY_CONTENT_SECURITY_POLICY_TEMPLATE: "script-src 'self' 'unsafe-inline' 'strict-dynamic' $$NONCE;object-src 'none';font-src 'self';style-src 'self' 'unsafe-inline' blob:;img-src 'self' data: blob:;base-uri 'self';connect-src 'self' ws://$$ROOT_PATH wss://$$ROOT_PATH;manifest-src 'self';media-src 'none';form-action 'self' $$FORM_ACTION_ADDITIONAL_HOSTS;frame-ancestors 'none';"
      GF_SECURITY_X_CONTENT_TYPE_OPTIONS: "true"
      GF_SECURITY_X_XSS_PROTECTION: "false"
      GF_SECURITY_ALLOW_EMBEDDING: "false"
      # Negar por padrão: ninguém se cadastra sozinho nem entra anônimo; usuário sem role mapeada fica sem papel.
      GF_USERS_ALLOW_SIGN_UP: "false"
      GF_USERS_ALLOW_ORG_CREATE: "false"
      GF_USERS_AUTO_ASSIGN_ORG_ROLE: None
      GF_USERS_VIEWERS_CAN_EDIT: "false"
      GF_USERS_DEFAULT_LANGUAGE: pt-BR
      GF_AUTH_ANONYMOUS_ENABLED: "false"
      GF_AUTH_DISABLE_LOGIN_FORM: "false"
      GF_AUTH_OAUTH_AUTO_LOGIN: "false"
      # Limites de sessão (ADR-0002): papel/revogação mudados no Keycloak valem no próximo login, então a sessão do Grafana
      # expira em horas (e não nos padrões de 7 dias inativo / 30 dias absoluto). Reautenticar relê as roles do Keycloak.
      GF_AUTH_LOGIN_MAXIMUM_INACTIVE_LIFETIME_DURATION: 8h
      GF_AUTH_LOGIN_MAXIMUM_LIFETIME_DURATION: 12h
      # SSO Keycloak (ADR-0002): Authorization Code + PKCE S256 no client confidencial "grafana" do realm workspace.
      # auth_url usa o host público (navegador); token_url/api_url usam o back-channel keycloak:8080 (rede workspace-identity)
      # e o issuer continua http://localhost:8180 (KC_HOSTNAME_BACKCHANNEL_DYNAMIC do Keycloak).
      GF_AUTH_GENERIC_OAUTH_ENABLED: "true"
      GF_AUTH_GENERIC_OAUTH_NAME: Keycloak
      GF_AUTH_GENERIC_OAUTH_CLIENT_ID: grafana
      GF_AUTH_GENERIC_OAUTH_CLIENT_SECRET: ${KC_GRAFANA_CLIENT_SECRET:?defina KC_GRAFANA_CLIENT_SECRET no .env (rode ./scripts/generate-env.sh)}
      GF_AUTH_GENERIC_OAUTH_SCOPES: openid email profile roles
      GF_AUTH_GENERIC_OAUTH_USE_PKCE: "true"
      GF_AUTH_GENERIC_OAUTH_AUTH_URL: http://localhost:8180/realms/workspace/protocol/openid-connect/auth
      GF_AUTH_GENERIC_OAUTH_TOKEN_URL: http://keycloak:8080/realms/workspace/protocol/openid-connect/token
      GF_AUTH_GENERIC_OAUTH_API_URL: http://keycloak:8080/realms/workspace/protocol/openid-connect/userinfo
      GF_AUTH_GENERIC_OAUTH_LOGIN_ATTRIBUTE_PATH: preferred_username
      GF_AUTH_GENERIC_OAUTH_EMAIL_ATTRIBUTE_PATH: email
      GF_AUTH_GENERIC_OAUTH_NAME_ATTRIBUTE_PATH: name
      # JMESPath (confirmado na doc 13.x). Sem "|| 'Viewer'" de propósito: sem role mapeada o resultado é vazio e,
      # com role_attribute_strict, o login é negado. O "admin" do realm vira Admin da org, nunca Server Admin.
      GF_AUTH_GENERIC_OAUTH_ROLE_ATTRIBUTE_PATH: "contains(roles[*], 'admin') && 'Admin' || contains(roles[*], 'grafana-editor') && 'Editor' || contains(roles[*], 'grafana-viewer') && 'Viewer'"
      GF_AUTH_GENERIC_OAUTH_ROLE_ATTRIBUTE_STRICT: "true"
      GF_AUTH_GENERIC_OAUTH_ALLOW_ASSIGN_GRAFANA_ADMIN: "false"
      GF_AUTH_GENERIC_OAUTH_SKIP_ORG_ROLE_SYNC: "false"
      # "allow_sign_up" aqui só cria o usuário no primeiro login Keycloak com role válida (o strict nega os demais).
      GF_AUTH_GENERIC_OAUTH_ALLOW_SIGN_UP: "true"
      GF_AUTH_GENERIC_OAUTH_AUTO_LOGIN: "false"
      # Logout encerra também a sessão no Keycloak; o post_logout_redirect_uri é exato no client (T04).
      GF_AUTH_GENERIC_OAUTH_SIGNOUT_REDIRECT_URL: http://localhost:8180/realms/workspace/protocol/openid-connect/logout?post_logout_redirect_uri=http%3A%2F%2Flocalhost%3A3000%2Flogin&client_id=grafana
      # Sem telemetria nem chamadas externas (grafana.com, notícias, snapshots públicos, catálogo de plugins).
      GF_ANALYTICS_REPORTING_ENABLED: "false"
      GF_ANALYTICS_CHECK_FOR_UPDATES: "false"
      GF_ANALYTICS_CHECK_FOR_PLUGIN_UPDATES: "false"
      GF_NEWS_NEWS_FEED_ENABLED: "false"
      GF_SNAPSHOTS_EXTERNAL_ENABLED: "false"
      GF_PLUGINS_PLUGIN_ADMIN_ENABLED: "false"
      # Sem baixar plugins pré-instalados (zipkin, pyroscope...) da grafana.com no start: só o plugin do build.
      GF_PLUGINS_PREINSTALL_DISABLED: "true"
      # Sem e-mail: notificação externa de alertas fica fora da v1 (decisão P4); o estado dos alertas só aparece na UI.
      GF_SMTP_ENABLED: "false"
      # Dashboard público contornaria o login (spec: nenhum acesso anônimo).
      GF_PUBLIC_DASHBOARDS_ENABLED: "false"
      # Logs JSON em stdout: o driver GELF (docker-compose.graylog.yml) os leva ao Graylog.
      GF_LOG_MODE: console
      GF_LOG_LEVEL: info
      GF_LOG_CONSOLE_FORMAT: json
    ports:
      # Só em localhost (sem exposição na rede local).
      - "127.0.0.1:3000:3000"
    # Provisionamento montado somente leitura: a mudança entra pelo repositório, e o volume guarda só o estado local.
    volumes:
      - grafana-data:/var/lib/grafana
      - ./provisioning/dashboards:/etc/grafana/provisioning/dashboards:ro
      - ./provisioning/datasources:/etc/grafana/provisioning/datasources:ro
      - ./provisioning/alerting:/etc/grafana/provisioning/alerting:ro
    # logs-ro: só Grafana e o opensearch-proxy (ADR-0004); o Grafana NÃO entra mais na logs-read (OpenSearch direto).
    # metrics: só para ler o Prometheus (T17); nessa rede não há blackbox nem APIs.
    networks: [observability, workspace-identity, logs-ro, metrics]
    depends_on:
      opensearch-proxy: { condition: service_healthy }
    healthcheck:
      test: ["CMD-SHELL", "curl -fs http://localhost:3000/api/health | grep -q '\"database\": \"ok\"'"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 20s
    restart: unless-stopped

  # Proxy somente leitura na frente do OpenSearch (ADR-0004): nginx + njs, allowlist estrita de rotas e índices.
  # Custo: mais um serviço a manter; se ele cair, o Grafana deixa de ler os logs e os alertas de log entram em erro.
  # Imagem por tag + digest (licença BSD-2-Clause). Sem porta no host; duas redes: logs-ro (Grafana) e logs-read (OpenSearch).
  opensearch-proxy:
    image: nginx:1.29-alpine@sha256:5616878291a2eed594aee8db4dade5878cf7edcb475e59193904b198d9b830de
    # Sem o entrypoint do nginx (que escreve em /etc/nginx): a configuração é montada pronta e só leitura.
    entrypoint: ["nginx", "-g", "daemon off;"]
    user: "101:101"
    # Teto de memória: um serviço não derruba os demais na VM do WSL2 (20 GB, ver ~/.wslconfig).
    mem_limit: 128m
    read_only: true
    tmpfs:
      - /tmp:size=64m,mode=1777,uid=101,gid=101
    cap_drop: [ALL]
    security_opt: ["no-new-privileges:true"]
    volumes:
      - ./opensearch-proxy/nginx.conf:/etc/nginx/nginx.conf:ro
      - ./opensearch-proxy/guard.js:/etc/nginx/guard.js:ro
    networks:
      logs-ro:
        aliases: [opensearch-ro]
      logs-read: {}
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1:8080/_proxy_health | grep -q ok"]
      interval: 10s
      timeout: 5s
      retries: 6
      start_period: 5s
    restart: unless-stopped

networks:
  # Redes compartilhadas com nome fixo, criadas pelos outros projetos (graylog, keycloak): não dependem do Grafana.
  observability:
    name: observability
    external: true
  workspace-identity:
    name: workspace-identity
    external: true
  # Rede do OpenSearch do Graylog (sem autenticação): agora só OpenSearch e opensearch-proxy entram nela (ADR-0004).
  logs-read:
    name: logs-read
    external: true
  # Grafana <-> proxy somente leitura (criada por este projeto, `internal`: sem saída para fora).
  logs-ro:
    internal: true
  # Leitura do Prometheus (T17, ADR-0003): criada por prometheus/docker-compose.metrics.yml (suba-o antes). `internal`;
  # o blackbox fica na rede metrics-probe, que o Grafana não alcança.
  metrics:
    name: metrics
    external: true

volumes:
  grafana-data:
